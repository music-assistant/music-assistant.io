# The link-in-bio page at https://www.music-assistant.io/bio/
#
# The page is this list, top to bottom. Move a block to move it; delete a
# block to remove it. A mistake here fails the build and names the item at
# fault, so nothing broken can reach the live page. The page itself is
# src/pages/bio.astro, with the rules in src/utils/bio.mjs.
#
# What fills the page by itself
#   Blog posts, release notes included, appear in the Latest list on their
#   own when they're published. The list keeps the newest few (its `limit`),
#   so older ones drop off by themselves. They never need dates added here.
#
# What you add by hand: `starts` and `ends`
#   Anything you add by hand (an item in Latest, or a link) uses the same
#   two keys:
#     - `starts`: when it appears. In the Latest list it's required, and it
#       also sets the item's place and the date shown on it, just like a
#       blog post's publish date. A date in the past shows it right away;
#       a future one makes it wait, then come in at the top of the list.
#       On links and YouTube items it's optional: without it, they show as
#       soon as the change is live.
#     - `ends`: when it goes. Optional: without it, the item stays until
#       you delete it.
#   A YouTube video or livestream also has `airs`: when it goes out, which
#   sets its place and date. Without `ends` it comes down at the end of the
#   day after it airs.
#
#   Write dates and times like this. Times are UTC unless you add an offset:
#     starts: 2026-11-15                  # from midnight UTC, Nov 15
#     starts: 2026-11-15T17:30:00Z        # from 17:30 UTC
#     starts: 2026-11-15T18:30:00+01:00   # the same moment, in CET
#     ends: 2026-11-15                    # up through the whole of Nov 15
#     ends: 2026-11-15T20:00:00Z          # down at 20:00 UTC
#   For midnight, write the date alone: an `ends` of 2026-11-15T00:00:00Z
#   is read as the date, so the item stays up through Nov 15.
#
#   There are no other date keys. `date`, `start`, `end` and `expires`
#   stop the build, and the message names the key to use instead.
#
#   You don't need to merge anything when `starts` or `ends` passes: the
#   page checks the time with the website (not the visitor's own clock) and
#   shows or hides items itself. Delete ended items whenever it suits you.
#
#   Scheduled items are in the page before they show, so anyone who reads
#   the page's source can see them early. Don't schedule anything that must
#   stay secret until it starts: merge it at the time instead.
#
# Images
#   Optional. YouTube items use the video's thumbnail by themselves. For
#   anything else, set `image:` to one of these:
#     image: auto                                    # the link's social preview image
#     image: https://store.openhomefoundation.org/…  # an image the linked site hosts
#     image: /assets/bio/2026-11-community-day.webp
#   For a new image, save it in public/assets/bio/ with the date in its
#   name. Make it 1200 × 630 pixels, WebP or JPEG, under about 200 KB, and
#   keep text and faces away from the edges: the cards crop to fit. One
#   image is enough: the small cards get a resized copy automatically.

tagline: Your music. Your way.
# Shown in search results and link previews, like the homepage.
description: Bring your streaming services and your own files into one library, and play them on speakers you already own.

sections:
  # The newest blog posts, release notes included, newest first. The first
  # item shows as a large card with its image on top.
  - type: feed
    title: Latest
    limit: 5
    # Add anything else to the list here, with `starts` and, if you like,
    # `ends` (see the top of this file).
    #   label: optional, shown before the date, e.g. Event
    #   note:  optional, shown instead of the label and date
    #   image: optional, see Images at the top of this file
    insert:
      - title: Community Day 2026
        url: https://www.openhomefoundation.org/community-day/
        note: Find or host a meetup near you on Saturday, November 7
        image: /assets/bio/2026-11-community-day.webp
        starts: 2026-11-03
        ends: 2026-11-07
    # A YouTube video or livestream shows as a large card with a play
    # button and opens YouTube. Before it airs it reads "Starts November 15
    # · 18:00 UTC"; after, it shows the date it aired.
    #  - type: youtube
    #    video: https://www.youtube.com/watch?v=XyAL1to3Lm4   # or just the ID
    #    title: "Music Assistant 2.11 release party"
    #    airs: 2026-11-15T18:00:00Z                           # or just a date
    #    label: Livestream                                    # optional
    #    starts: 2026-11-12                                   # optional: when it appears; without it, right away
    #    ends: 2026-11-22                                     # optional: keep the replay up longer

  # Links that always sit under the Latest list. Add a campaign here, and
  # give it `starts` and `ends` to show it only for a while.
  - type: links
    title: Featured
    items:
      - label: Merch store
        url: https://store.openhomefoundation.org/

  - type: links
    title: Get started
    items:
      - label: Install Music Assistant
        url: /get-started/
        featured: true # picked out in the accent colour; use it once
      - label: Documentation
        url: /documentation/
      - label: Chat on Discord
        url: https://discord.gg/kaVm8hGpne

# Icon buttons at the bottom. `platform` is one of: github, discord,
# youtube, mastodon, bluesky, instagram, threads, linkedin, reddit,
# facebook, tiktok, x, rss.
socials:
  - { platform: github, url: "https://github.com/music-assistant" }
  - { platform: discord, url: "https://discord.gg/kaVm8hGpne" }
